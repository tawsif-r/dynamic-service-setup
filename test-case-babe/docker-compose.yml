services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping')
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file:
      - .env
    ports:
      - 3000:3000
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    restart: unless-stopped
    depends_on:
      - mongodb
volumes:
  mongo_data: null
